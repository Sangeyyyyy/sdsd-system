name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck, build, and tests
    runs-on: ubuntu-latest

    env:
      # Build-time placeholders. Tests replace DATABASE_URL with their own
      # throwaway SQLite files.
      DATABASE_URL: file:data/ci.db
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Booking tests
        run: npm run test:booking

      - name: Admin tests
        run: npm run test:admin

      - name: Students tests
        run: npm run test:students

      - name: School-year tests
        run: npm run test:year

      - name: Cancel tests
        run: npm run test:cancel

      - name: Bulk tests
        run: npm run test:bulk

      - name: Report tests
        run: npm run test:reports

      - name: Reset tests
        run: npm run test:reset